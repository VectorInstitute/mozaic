# AV-HuBERT trained on the full MOZAIC's t2 (layernorm tuning), tested on t2's test split (--subset: Small's or the full one)
model: avhubert                     # name in load_model; results in results/avhubert/ln_mean_mlp_trainfull/t2/
family: classifier
trained:                            # the training run: its config (training/configs) and data
  config: avhubert/t2_ln
  data: full                        # full: training/; small: training_small/ (whatever --subset tests)
experiment_name: ln_mean_mlp_trainfull  # results/<model>/ln_mean_mlp_trainfull/ (results_small/ with --subset small)
# frames, audio rate, input format: the training config inside best.pt

batch_size: 256                     # questions per predict_proba call
micro_batch_size: 16                # clips per forward; memory only
workers: 8                          # clip readers
stop_after_failures: 3

tasks:                              # test split only: train and val were seen in training
  t2:
    file: t2_test.jsonl
