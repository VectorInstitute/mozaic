# AV-HuBERT trained on MOZAIC-Small's t2 (full tuning), tested on t2's test split (--subset: Small's or the full one)
model: avhubert                     # name in load_model; results in results/avhubert/full_mean_mlp_trainsmall/t2/
family: classifier
trained:                            # the training run: its config (training/configs) and data
  config: avhubert/t2_full
  data: small                       # full: training/; small: training_small/ (whatever --subset tests)
experiment_name: full_mean_mlp_trainsmall  # results/<model>/full_mean_mlp_trainsmall/ (results_small/ with --subset small)
# frames, audio rate, input format: the training config inside best.pt

batch_size: 256                     # questions per predict_proba call
micro_batch_size: 16                # clips per forward; memory only
workers: 8                          # clip readers
stop_after_failures: 3

tasks:                              # test split only: train and val were seen in training
  t2:
    file: t2_test.jsonl
