# AV-HuBERT trained on MOZAIC-Small's t3 (layernorm tuning, our pair head), tested on t3's full test split (no --subset; Small's from its answers)
model: avhubert                     # name in load_model; results in results/avhubert/ln_mean_mlp_trainsmall/t3/
family: classifier
trained:                            # the training run: its config (training/configs) and data
  config: avhubert/t3_ln
  data: small                       # full: training/; small: training_small/ (whatever --subset tests)
experiment_name: ln_mean_mlp_trainsmall  # results/<model>/ln_mean_mlp_trainsmall/ (results_small/ with --subset small)
# frames, audio rate, input format: the training config inside best.pt

batch_size: 256                     # questions per predict_proba call
micro_batch_size: 8                 # questions per forward (two clips each: the 16 clips of t1's); memory only
workers: 8                          # clip readers
stop_after_failures: 3

tasks:                              # test split only: train and val were seen in training
  t3:
    file: t3_test.jsonl
    filters:
      arms: [vocoded]               # as in training: voice questions with vocoded real voices (and converted ones); face questions always kept
