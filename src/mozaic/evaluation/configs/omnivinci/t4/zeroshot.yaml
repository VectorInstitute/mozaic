# omnivinci/t1/zeroshot.yaml for T4, zero-shot: its input unchanged; a T4-length answer
model: omnivinci                    # code in models/mllms/omnivinci, results in results/omnivinci
family: mllm                        # mllm (answers in text) or classifier (class probabilities)
model_version: nvidia/omnivinci
weights: models_weights/omnivinci   # our copy, HF revision 7b3777b1, read only; its code comes with it

experiment_name: zeroshot_32f_224   # results go to {experiment_name}_{split}, e.g. zeroshot_32f_224_test

# The input: model.py reads each clip with the same reader as every model and turns it into OmniVinci's input with
# the authors' own steps.
frames: 32                          # per clip, evenly spaced (also OmniVinci's default)
audio_sample_rate: 16000            # as every config; OmniVinci hears sound at 16 kHz
# Frame size: we send the clips' own 224 x 224 frames; its picture encoder enlarges them to 448 x 448, and inside the
# model every 8 neighbouring frames are averaged into one (as it was trained): 4 pictures per clip. t1 sends each
# clip's frames with its sound, as one video with its soundtrack; t2 and t3's face questions send silent videos, t3's
# voice questions the two sounds. Sound: its sound encoder takes 30 s (the clip's sound, then silence); the language
# model gets only the pieces that cover the clip's own sound (t1: the model cuts them itself; t3: model.py, the same way).

generation:                         # transformers' generate(), as the authors' example calls it
  do_sample: false                  # greedy, as every model on T1-T3
  max_new_tokens: 8192              # T4's limit (evaluation/README.md, Generation); T1-T3: 256
  repetition_penalty: 1.0           # off, as every model answers (its language model's generation_config.json says 1.05)

stop_after_failures: 3              # failed questions in a row before the run stops

tasks:                              # T4 on MOZAIC-Small's test split
  t4:
    file: t4_{split}.jsonl          # results in {experiment_name}_test, as T1-T3; --subset small only (T4 exists on Small only); never t4_golden.jsonl
