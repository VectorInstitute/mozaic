model: ola                          # code in models/mllms/ola, results in results/ola
family: mllm                        # mllm (answers in text) or classifier (class probabilities)
model_version: THUdyh/Ola-7b
weights: models_weights/ola-7b   # our copy, HF revision d2fcaa53, read only (with its Whisper and BEATs files)
code: external-repos/ola              # the authors' code, git-ignored: github Ola-Omni/Ola, f681820
cuda_home: models_weights/cuda-nvcc-12.1   # CUDA 12.1's nvcc (conda, nvidia channel): deepspeed asks it its version

experiment_name: zeroshot_32f_224   # results go to {experiment_name}_{split}, e.g. zeroshot_32f_224_test

# The input: model.py reads each clip with the same reader as every model and turns it into Ola's input with the
# authors' own steps.
frames: 32                          # per clip, evenly spaced, as every model (its own example takes 64); all 32 reach
                                    # the language model (see the README)
audio_sample_rate: 16000            # as every config; Ola hears sound at 16 kHz
# Frame size: its own step enlarges each 224 x 224 frame to 256 x 256; the model makes 73 pieces of each. t1 sends
# each clip's frames and its sound (the model puts the video first, then the sound); t2 and t3's face questions send
# silent videos, t3's voice questions the two sounds. Its two sound encoders take 30 s windows (the clip's sound, then
# silence); their projector makes a piece of every 10 encoder steps: 150 a window.
silence: cut                        # only the encoder steps of the clip's own sound go on (154 for 3 s, 306 for 6 s:
                                    # 15 and 30 pieces); kept: every step of the 30 s window, the authors' way
answer_choices: true                # the reply can only be {"answer": "<one of the options>"}, as minicpm_o_vllm: Ola
                                    # often writes the option alone ("the video"), which the prompts can't read

generation:                         # transformers' generate(), as the authors' example calls it
  do_sample: false                  # greedy, as every model on T1-T3
  max_new_tokens: 256               # a T1-T3 answer is a short JSON
  repetition_penalty: 1.0           # off, as every model answers (its generation_config.json sets 1.05)

stop_after_failures: 3              # failed questions in a row before the run stops

# Question file and filters per task, as in gemini_3_8_flash/t1/zeroshot.yaml; {split} is --split (test by default).
tasks:
  t3:
    file: t3_{split}.jsonl
    filters:
      arms: [vocoded]               # voice questions: vocoded real voices (and converted ones); face questions always kept
