# nemotron_omni_vllm/t1/zeroshot.yaml for T4, zero-shot: its input unchanged; a T4-length answer
model: nemotron_omni_vllm           # code in models/mllms/nemotron_omni_vllm, results in results/nemotron_omni_vllm
family: mllm                        # mllm (answers in text) or classifier (class probabilities)
model_version: nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-BF16
trained:                            # the training run: its config (training/configs) and data
  config: nemotron/t4_lora
  data: small

experiment_name: mozaic_sft_lora_32f_224_trainsmall

# The input: each clip is read by vLLM's own readers, as vLLM reads it for this model when serving.
frames: 32                          # per clip, evenly spaced (vLLM's video reader, num_frames)
frame_size: 224                     # the clips' own 224 x 224 (by default Nemotron enlarges them to 512)
audio_sample_rate: 16000            # as every config; Nemotron hears sound at 16 kHz
normalize_audio: true               # vLLM 0.28 gives this data's sound unscaled; training has it in [-1, 1]
# t1 sends each clip as one video with its sound (use_audio_in_video): vLLM puts the sound right after the
# video's frames. t2 and t3's face questions send silent videos, t3's voice questions the two sounds.

vllm:                               # vLLM's engine
  tensor_parallel_size: 2           # split over 2 A40s (48 GB each): its 62 GB of weights do not fit one (1 on an A100)
  gpu_memory_utilization: 0.92      # share of each GPU's memory vLLM may use
  mm_processor_cache_gb: 0          # no cache: every clip is read fresh (as in the Qwen configs)
  trust_remote_code: true           # the weights folder has some of the model's own Python code; vLLM must run it
  seed: 0

chat_template_kwargs:               # Nemotron's chat template
  enable_thinking: false            # reasoning off (on by default): it answers right away; a T1-T3 answer is a short JSON

generation:                         # vLLM's SamplingParams
  temperature: 0.0                  # greedy, as every model on T1-T3
  max_tokens: 8192                  # T4's limit (evaluation/README.md, Generation); T1-T3: 256

batch_size: 100                     # questions run_inference gives the model at once; vLLM answers them together
readers: 12                         # threads reading a batch's clips
stop_after_failures: 3              # failed batches in a row before the run stops

tasks:                              # T4 on MOZAIC-Small's test split
  t4:
    file: t4_test.jsonl             # --subset small only; never t4_golden.jsonl
