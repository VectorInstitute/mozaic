model: uni_moe_2_omni               # code in models/mllms/uni_moe_2_omni, results in results/uni_moe_2_omni
family: mllm                        # mllm (answers in text) or classifier (class probabilities)
model_version: HIT-TMG/Uni-MoE-2.0-Omni
weights: models_weights/uni-moe-2.0-omni   # our copy, HF revision e4bdc034, read only (its image- and speech-generation files not used)
code: external-repos/uni_moe_2/Uni-MoE-2   # the authors' code, git-ignored: github HITsz-TMG/Uni-MoE, 6f18a7a
cuda_home: models_weights/cuda-nvcc-12.1   # CUDA 12.1's nvcc (conda, nvidia channel): deepspeed asks it its version

experiment_name: zeroshot_32f_224   # results go to {experiment_name}_{split}, e.g. zeroshot_32f_224_test

# The input: model.py reads each clip with the same reader as every model and turns it into Uni-MoE's input with the
# authors' own steps.
frames: 32                          # per clip, evenly spaced, as every model (its own reader takes 1 a second, at least
                                    # 8: 8 for our clips; at most 32 for a video with its sound)
audio_sample_rate: 16000            # as every config; Uni-MoE hears sound at 16 kHz
# Frame size: its picture encoder takes 384 x 384, so each 224 x 224 frame is enlarged; the model makes 144 pieces of
# each frame. t1 sends each clip's frames and its sound (video, then sound); t2 and t3's face questions send silent
# videos, t3's voice questions the two sounds. Its sound encoder takes 30 s windows (the clip's sound, then silence)
# and sums each up in 200 pieces.
silence: cut                        # the 200 pieces read only the clip's own sound; kept: every step of the 30 s window
answer_choices: true                # the reply can only be {"answer": "<one of the options>"}, as minicpm_o_vllm: Uni-MoE
                                    # often writes the option alone ("face swap"), which the prompts can't read

generation:                         # transformers' generate(), as the authors' examples call it
  do_sample: false                  # greedy, as every model on T1-T3
  max_new_tokens: 256               # a T1-T3 answer is a short JSON
  repetition_penalty: 1.0           # off, as every model answers (its generation_config.json sets none)

stop_after_failures: 3              # failed questions in a row before the run stops

# Question file and filters per task, as in gemini_3_8_flash/t1/zeroshot.yaml; {split} is --split (test by default).
tasks:
  t1:
    file: t1_{split}.jsonl
    filters:
      arms: [vocoded]               # real-voice clips only; fake-voice clips have one arm and are always kept
