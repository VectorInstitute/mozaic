# PE-AV trained on MOZAIC-Small's t3 (full tuning, our pair head), tested on t3's full test split (no --subset; Small's from its answers)
model: pe_av                        # name in load_model; results in results/pe_av/full_mean_mlp_trainsmall/t3/
family: classifier
trained:                            # the training run: its config (training/configs) and data
  config: pe_av/t3_full
  data: small                       # full: training/; small: training_small/ (whatever --subset tests)
experiment_name: full_mean_mlp_trainsmall  # results/<model>/full_mean_mlp_trainsmall/ (results_small/ with --subset small)
# frames, audio rate, input format: the training config inside best.pt

batch_size: 256                     # questions per predict_proba call
micro_batch_size: 2                 # questions per forward (two clips each: the 4 clips of t1's); memory only
workers: 8                          # clip readers
stop_after_failures: 3

tasks:                              # test split only: train and val were seen in training
  t3:
    file: t3_test.jsonl
    filters:
      arms: [vocoded]               # as in training: voice questions with vocoded real voices (and converted ones); face questions always kept
