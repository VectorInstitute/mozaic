model: avhubert
task: t2
experiment_name: full_mean_mlp      # training/avhubert/full_mean_mlp/t2/; change it when a setting changes

questions:                          # the same as evaluation: all T2 questions kept
  train:
    file: t2_train.jsonl
    # filters:                      # not used
    #   frames: [77]                # 77 only: Animate exists only at 77f
  val:
    file: t2_val.jsonl

frames: 32                          # as every evaluated model: evenly spaced, full frame
audio_sample_rate: 16000            # not read: t2 is about the video only (AV-HuBERT's video branch alone)

backbone:
  checkpoint: models_weights/avhubert/large_vox_iter5.pt
  code: external-repos/av_hubert             # the authors' repo: avhubert/ and their fairseq fork

head: {type: mlp, dropout: 0.1}
tuning: {mode: full}                # frozen | layernorm | full

train:
  epochs: 10
  lr: 1.0e-4
  weight_decay: 0.01
  batch_size: 32                    # per optimizer step, over all GPUs
  micro_batch_size: 4               # per GPU per forward; memory only (full: gradients through the backbone)
  workers: 8                        # per GPU
  seed: 0
  amp: bf16
  class_weights: balanced
  select_on: macro.f1
  log_every: 50

log:
  wandb: true
  project: mozaic
  entity: null                      # W&B team or user; null: the logged-in account's default
