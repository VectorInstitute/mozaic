model: pe_av
task: t2
experiment_name: full_mean_mlp      # training/pe_av/full_mean_mlp/t2/; change it when a setting changes

questions:                          # the same as evaluation: all T2 questions kept
  train:
    file: t2_train.jsonl
    # filters:                      # not used
    #   frames: [77]                # 77 only: Animate exists only at 77f
  val:
    file: t2_val.jsonl

frames: 32                          # as every evaluated model: evenly spaced, full frame
audio_sample_rate: 48000            # not read: t2 is about the video only (PE-AV's video encoder alone)

backbone:
  weights: models_weights/pe_av/pe-av-large   # facebook/pe-av-large: audio, video (PE-L per frame) and audio-video encoders

head: {type: mlp, dropout: 0.1}
tuning: {mode: full}                # frozen | layernorm | full

train:
  epochs: 10
  lr: 1.0e-4
  weight_decay: 0.01
  batch_size: 32                    # per optimizer step, over all GPUs
  micro_batch_size: 1               # per GPU per forward: 32 frames through PE-L at 336; memory only
  workers: 8                        # per GPU
  seed: 0
  amp: bf16
  class_weights: balanced
  select_on: macro.f1
  log_every: 50

log:
  wandb: true
  project: mozaic
  entity: null                      # W&B team or user; null: the logged-in account's default
