model: minicpm_o
task: t4
experiment_name: lora_32f_224       # training_small/minicpm_o/lora_32f_224/t4/; change it when a setting changes
weights: models_weights/minicpm-o-4_5   # the copy evaluation uses, read only

questions:                          # T4 exists on MOZAIC-Small only: --subset small
  train:
    file: t4_train.jsonl
  val:
    file: t4_val.jsonl

eval_config: minicpm_o_vllm/t4/lora_trainsmall   # evaluation/configs: its generation (greedy, 8192 tokens) for validation

# The input, as evaluation's minicpm_o_vllm/t1/zeroshot.yaml, with the sound in [-1, 1] (minicpm_o_inputs.py)
frames: 32                          # evenly spaced, full frame
audio_sample_rate: 16000

train:                              # the protocol's recipe, as Qwen2.5-Omni's T4
  epochs: 3
  lr: 1.0e-4
  weight_decay: 0.01                # AdamW, no schedule
  batch_size: 32                    # per optimizer step, over all GPUs
  micro_batch_size: 1               # per GPU per forward; memory only
  workers: 8                        # per GPU
  seed: 0
  select_on: text.both.rouge_l      # t4_metrics' ROUGE-L of both parts: no judge call per epoch

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj   # the language model's; LLaMA-Factory leaves frozen towers out

llamafactory:                       # passed to LLaMA-Factory as they are
  trust_remote_code: true
  freeze_vision_tower: true         # the vision and audio towers
  freeze_multi_modal_projector: true
  cutoff_len: 4096                  # about 2,500 prompt tokens (frames + sound + prompt) + reply
  preprocessing_num_workers: 16
  logging_steps: 10
  ddp_timeout: 180000000
